spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/psyllabus_dev}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: false
  data:
    redis:
      host: localhost
      port: 6379

tenant:
  domain:
    base: localhost # or psyllabus.local if using hosts file
    separator: "."

logging:
  level:
    io.psyllabus: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.sql: DEBUG
