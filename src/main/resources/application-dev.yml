spring:
  datasource:
    url: ${DEV_DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      password:
    # Disable spring-boot-docker-compose auto-start
    # We start infrastructure manually so local Postgres doesn't conflict with Docker's
  docker:
    compose:
      enabled: false

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASS:admin}

tenant:
  domain:
    base: localhost # or psyllabus.local if using hosts file
    separator: "."

logging:
  level:
    io.psyllabus: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.sql: DEBUG
    #This silences the "Using docker compose file ..." and "Services running..." mesages
    org.springframework.boot.docker.compose: WARN
    #This silences the specific lifecycle management that prints image/container status
    org.springframework.boot.docker.compose.lifecycle: WARN


jwt:
  secret-key: ${DEV_JWT_SECRET_KEY}
  signing-key: ${DEV_SIGNING_KEY}
  access-token-expiration: ${DEV_JWT_ACCESS_EXPR}
  refresh-token-expiration: ${DEV_JWT_REFRESH_EXPR}
