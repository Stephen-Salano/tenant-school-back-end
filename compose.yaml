version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: psyllabus-postgres
    environment:
      POSTGRES_DB: psyllabus_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - psyllabus-network

  redis:
    image: redis:7-alpine
    container_name: psyllabus-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - psyllabus-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: psyllabus-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - psyllabus-network

  prometheus:
    image: prom/prometheus:latest
    container_name: psyllabus-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - psyllabus-network

  grafana:
    image: grafana/grafana:latest
    container_name: psyllabus-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
      - loki
    networks:
      - psyllabus-network


  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    networks:
      - psyllabus-network

  alloy:
    image: grafana/alloy:latest
    container_name: psyllabus-alloy
    ports:
      - "12345:12345"   # Alloy web UI — http://localhost:12345
    volumes:
      - /home/salano/IdeaProjects/Psyllabus Platform API/logs:/logs
      - ./alloy-config.alloy:/etc/alloy/config.alloy
      - alloy_data:/var/lib/alloy/data   # buffer storage
    command: >
      run
      --server.http.listen-addr=0.0.0.0:12345
      --storage.path=/var/lib/alloy/data
      /etc/alloy/config.alloy
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach localhost Spring Boot
    networks:
      - psyllabus-network

networks:
  psyllabus-network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  alloy_data: